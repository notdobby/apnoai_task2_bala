<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card — ApnoAI Task 2</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .glass {
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.24);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-dark {
      background: rgba(8,15,30,.55);
      border: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .cursor { display:inline-block; width:2px; height:1em; background:currentColor; margin-left:2px; vertical-align:-2px; animation:blink .8s steps(2,start) infinite; }
    @keyframes blink { to { visibility:hidden; } }
    button:focus-visible, a:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState } = React;

    function ProfileCard({ name, role, bio, skills, avatar, github, twitter, linkedin, instagram }) {
      const [isDark, setIsDark] = useState(false);
      const [isConnected, setIsConnected] = useState(false);
      const [likes, setLikes] = useState(0);
      const [typedBio, setTypedBio] = useState("");

      // Reveal the bio one character at a time when the component loads.
      useEffect(() => {
        let index = 0;
        const timer = window.setInterval(() => {
          index += 1;
          setTypedBio(bio.slice(0, index));
          if (index >= bio.length) window.clearInterval(timer);
        }, 28);
        return () => window.clearInterval(timer);
      }, [bio]);

      const socialClass = `p-3 rounded-full transition-transform hover:scale-110 ${
        isDark ? "bg-white/10 text-white" : "bg-white/50 text-gray-900"
      }`;

      return (
        <main className={`${
          isDark
            ? "bg-gradient-to-br from-slate-950 via-indigo-950 to-cyan-950"
            : "bg-gradient-to-br from-sky-400 via-cyan-400 to-emerald-400"
        } min-h-screen w-full flex items-center justify-center p-4 transition-colors duration-500`}>
          <button
            onClick={() => setIsDark(value => !value)}
            className="fixed top-4 right-4 p-3 rounded-full glass hover:scale-110 transition-transform z-10"
            title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}
            aria-label={isDark ? "Switch to light mode" : "Switch to dark mode"}
          >
            {isDark ? "☀️" : "🌙"}
          </button>

          <section className={`${isDark ? "glass-dark" : "glass"} rounded-3xl p-8 max-w-md w-full shadow-2xl`}>
            <div className="flex justify-center mb-6">
              <img
                src={avatar}
                alt={`${name}'s profile`}
                className="w-32 h-32 rounded-full object-cover border-4 border-white/30 shadow-lg"
              />
            </div>

            <header className="text-center mb-6">
              <h1 className={`text-3xl font-bold mb-2 ${isDark ? "text-white" : "text-gray-950"}`}>{name}</h1>
              <p className={`text-lg ${isDark ? "text-gray-300" : "text-gray-800"}`}>{role}</p>
            </header>

            <p className={`text-center mb-6 leading-relaxed min-h-[4.5rem] ${isDark ? "text-gray-300" : "text-gray-900"}`}>
              {typedBio}<span className="cursor" aria-hidden="true"></span>
            </p>

            <div className="flex flex-wrap gap-2 justify-center mb-6">
              {skills.map((skill) => (
                <span key={skill} className={`px-3 py-1 rounded-full text-sm font-medium ${
                  isDark ? "bg-white/10 text-white border border-white/20" : "bg-white/50 text-gray-950 border border-white/30"
                }`}>{skill}</span>
              ))}
            </div>

            <button
              onClick={() => setIsConnected(value => !value)}
              className={`w-full py-3 rounded-xl font-semibold mb-3 transition-all ${
                isConnected ? "bg-green-600 text-white" : isDark ? "bg-white text-gray-900 hover:bg-gray-100" : "bg-gray-950 text-white hover:bg-gray-800"
              }`}
            >
              {isConnected ? "✓ Connected" : "Connect"}
            </button>

            <button
              onClick={() => setLikes(count => count + 1)}
              className={`w-full py-3 rounded-xl font-semibold mb-6 transition-all ${
                isDark ? "bg-rose-500/20 text-rose-200 hover:bg-rose-500/30" : "bg-white/55 text-rose-700 hover:bg-white/75"
              }`}
              aria-label={`Like profile. ${likes} likes`}
            >
              ♥ Like · {likes}
            </button>

            <nav className="flex justify-center gap-4" aria-label="Social links">
              {github && <a href={github} target="_blank" rel="noopener noreferrer" className={socialClass} aria-label="GitHub">
                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
              </a>}
              {twitter && <a href={twitter} target="_blank" rel="noopener noreferrer" className={socialClass} aria-label="X">
                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.9 2H22l-6.78 7.75L23.2 22h-6.25l-4.9-7.43L5.55 22H2.4l7.25-8.29L1.8 2h6.4l4.43 6.77L18.9 2Zm-1.1 18h1.73L7.27 3.9H5.4L17.8 20Z"/></svg>
              </a>}
              {linkedin && <a href={linkedin} target="_blank" rel="noopener noreferrer" className={socialClass} aria-label="LinkedIn">
                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
              </a>}
              {instagram && <a href={instagram} target="_blank" rel="noopener noreferrer" className={socialClass} aria-label="Instagram">
                <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7Zm0 2h10c1.66 0 3 1.34 3 3v10c0 1.66-1.34 3-3 3H7c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3Zm11 1.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg>
              </a>}
            </nav>

            <footer className="mt-6 pt-6 border-t border-white/20 text-center">
              <p className={`text-xs ${isDark ? "text-gray-400" : "text-gray-800"}`}>
                Built with React 18 + Tailwind CSS · ApnoAI Task 2
              </p>
            </footer>
          </section>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ProfileCard
        name="Bala Sudalaimuthu"
        role="AI & Full-Stack Developer"
        bio="Engineering student building practical software, exploring AI/ML, and turning ideas into useful products."
        skills={["React", "TypeScript", "Node.js", "FastAPI", "AI/ML"]}
        avatar="https://res.cloudinary.com/dzhvomgq6/image/upload/v1794543098/178264125_vrrq2y.png"
        github="https://github.com/notfawkes"
        twitter="https://x.com/BalaSudala8199"
        linkedin="https://www.linkedin.com/in/bala-sudalaimuthu-a34b53355/"
        instagram="https://www.instagram.com/"
      />
    );
  </script>
</body>
</html>
